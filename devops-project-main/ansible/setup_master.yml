# Corrige le doublon register/args (bug Ansible : deux 'register' et deux 'args' sur la même tâche)
- name: Initialisation du master Kubernetes
  hosts: master
  become: yes

  tasks:
    - name: Initialiser le cluster Kubernetes
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
        --ignore-preflight-errors=Mem
      register: kubeadm_init
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Créer le dossier .kube pour l'utilisateur courant
      file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copier la configuration kubectl
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Installer le réseau Flannel (CNI)
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: kubeadm_init.changed

    - name: Générer la commande kubeadm join pour les workers
      shell: kubeadm token create --print-join-command
      register: join_command
      when: kubeadm_init.changed

    - name: Sauvegarder la commande join dans un fichier temporaire
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/kubeadm_join_command.txt
      when: kubeadm_init.changed
