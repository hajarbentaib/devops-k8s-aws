name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app

jobs:
  # ============================================================
  # JOB 1 : Tests unitaires
  # ============================================================
  test:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Exécuter les tests avec pytest
        run: |
          cd app
          python -m pytest test_app.py -v --tb=short

  # ============================================================
  # JOB 2 : Build et push de l'image Docker
  # (uniquement sur push vers main, pas sur les PRs)
  # ============================================================
  build-and-push:
    name: 🐳 Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Déploiement sur Kubernetes
  # (uniquement sur push vers main, après le build réussi)
  # ============================================================
  deploy:
    name: 🚀 Déploiement Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configurer le contexte Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Mettre à jour l'image dans le déploiement Kubernetes
        run: |
          kubectl set image deployment/flask-api-deployment \
            flask-api=${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --namespace=default

      - name: Vérifier le déploiement
        run: |
          kubectl rollout status deployment/flask-api-deployment \
            --namespace=default \
            --timeout=120s

      - name: Vérifier l'état des pods
        run: kubectl get pods --namespace=default -l app=flask-api
