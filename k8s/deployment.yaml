apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-deployment
  namespace: default
  labels:
    app: flask-api
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: assan23/flask-devops-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

          # Variables d'environnement (le debug est désactivé en production)
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: APP_NAME

          # Limites de ressources pour éviter la saturation du noeud
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          # Readiness probe : K8s n'envoie du trafic que quand l'app est prête
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          # Liveness probe : K8s redémarre le pod si l'app ne répond plus
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
